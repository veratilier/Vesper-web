name: Chat screenshot renderer
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow
      - run: sudo apt-get update -qq
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: python3 vps/test_chat_screenshot.py
      - run: python3 vps/test_chat_screenshot_render.py
