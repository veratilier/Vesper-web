services:
  xinchao:
    build:
      context: ./source/xinchao
    restart: unless-stopped
    ports:
      - "127.0.0.1:18110:18110"
    env_file:
      - service.env
    environment:
      PORT: "18110"
      AGENT_NAME: Rowan
      NOTIFICATION_RECIPIENT: Vera
      MODEL_ENABLED: "false"
      MCP_ENABLED: "true"
      MCP_SELF_REPORT_GATE: "true"
      SHADOW_MODE: "true"
      DREAM_ENABLED: "false"
      BARK_ENABLED: "false"
      DAYTIME_EMERGENCE_ENABLED: "false"
      BRIDGE_ENABLED: "false"
      OMBRE_READ_ENABLED: "false"
      OMBRE_WRITE_ENABLED: "false"
      CONTEXT_OMBRE_ENABLED: "false"
      DASHBOARD_ENABLED: "false"
      OAUTH_ENABLED: "false"
      ATTENTION_ENABLED: "false"
      # Vesper owns sleep and wake scheduling; do not add a 90-minute idle sleep.
      SLEEP_AFTER_MINUTES: "10080"
      SETTLE_TIME_ZONE: Asia/Shanghai
      INTERACTION_TIME_ZONE: Asia/Shanghai
    volumes:
      - state:/app/state
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:18110/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  state:
